workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - src/**/*
        - public/**/*
        - package.json
        - package-lock.json
        - astro.config.mjs
        - tsconfig.json
        - Dockerfile
        - .dockerignore
        - chart/**/*
        - .gitlab-ci.yml

build-image:
  image: docker:28
  script:
    - echo "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token --password-stdin "$CI_REGISTRY"
    - docker build --provenance=false -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

package-chart:
  image:
    name: alpine/helm:4.3.2
    entrypoint: [""]
  needs: [build-image]
  script:
    - helm lint chart
    - helm package chart --version "0.1.$CI_PIPELINE_IID" --app-version "$CI_COMMIT_SHORT_SHA"
    - >
      curl --fail-with-body --user "gitlab-ci-token:$CI_JOB_TOKEN"
      --form "chart=@zalog-alters-si-0.1.$CI_PIPELINE_IID.tgz"
      "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/helm/api/stable/charts"
