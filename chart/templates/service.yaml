apiVersion: v1
kind: Service
metadata:
  name: {{ include "zalog-alters-si.fullname" . }}
  labels:
    {{- include "zalog-alters-si.labels" . | nindent 4 }}
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    {{- include "zalog-alters-si.selectorLabels" . | nindent 4 }}
