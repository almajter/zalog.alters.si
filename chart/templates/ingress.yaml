apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "zalog-alters-si.fullname" . }}
  labels:
    {{- include "zalog-alters-si.labels" . | nindent 4 }}
spec:
  rules:
    - host: {{ .Values.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "zalog-alters-si.fullname" . }}
                port:
                  name: http
